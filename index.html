<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Durán Fotografía — Portafolio</title>
  <meta name="description" content="Portafolio de Mateo Durán — fotografía" />
  <style>
    :root{--bg:#f4f5f7;--card:#fff;--text:#0b0b0b;--muted:#6b7280;--accent:#0b5cff}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#4f46e5);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
    h1{font-size:18px;margin:0}
    nav{display:flex;gap:14px;align-items:center}
    a.navlink{color:var(--muted);text-decoration:none;font-size:14px}
    a.cta{background:var(--accent);color:white;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:600}
    .hero{padding:32px 28px;display:grid;grid-template-columns:1fr 420px;gap:24px;align-items:center}
    .hero-left h2{font-size:34px;margin:0 0 12px}
    .hero-left p{color:var(--muted);margin:0 0 18px}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 28px 28px}
    .card{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(12,12,12,0.06);cursor:pointer}
    .card img{display:block;width:100%;height:220px;object-fit:cover}
    .footer{padding:18px 28px;color:var(--muted);font-size:14px;text-align:center}
    @media (max-width:900px){
      .hero{grid-template-columns:1fr;padding:20px}
      .gallery{grid-template-columns:repeat(2,1fr)}
      .card img{height:180px}
    }
    @media (max-width:520px){
      .gallery{grid-template-columns:1fr}
      .card img{height:220px}
    }
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:1200}
    .modal.open{display:flex}
    .modal img{max-width:95vw;max-height:85vh;border-radius:8px}
    .modal .close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,0.95);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;border:0}
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo">MD</div>
      <div>
        <h1>Durán Fotografía</h1>
        <div style="color:var(--muted);font-size:13px">Fotografía editorial · producto · retrato</div>
      </div>
    </div>
    <nav>
      <a class="navlink" href="#portfolio">Portfolio</a>
      <a class="navlink" href="#about">Sobre</a>
      <a class="cta" href="mailto:tu@email.com">Contactar</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-left">
      <h2>Fotografía con atmósfera</h2>
      <p>Proyectos editoriales, producto y retrato. Juego con luz tenue y texturas para crear tensión y presencia.</p>
    </div>
    <div>
      <div class="card" style="height:100%">
        <img src="portada.JPEG" alt="Portada principal">
      </div>
    </div>
  </section>

  <section id="portfolio" class="gallery">
    <!-- Fotos desde tu carpeta Modelos -->
    <div class="card"><img src="Modelos/modelo1.jpg" alt="Modelo 1"></div>
    <div class="card"><img src="Modelos/modelo2.jpg" alt="Modelo 2"></div>
    <div class="card"><img src="Modelos/modelo3.jpg" alt="Modelo 3"></div>

    <!-- Fotos desde tu carpeta Terrenal -->
    <div class="card"><img src="Terrenal/terr1.jpg" alt="Terrenal 1"></div>
    <div class="card"><img src="Terrenal/terr2.jpg" alt="Terrenal 2"></div>
    <div class="card"><img src="Terrenal/terr3.jpg" alt="Terrenal 3"></div>
  </section>

  <footer class="footer">
    © Mateo Durán — Durán Fotografía
  </footer>

  <div id="lightbox" class="modal" role="dialog" aria-hidden="true">
    <button class="close" id="lbClose" aria-label="Cerrar">✕</button>
    <img id="lbImg" src="" alt="Imagen ampliada">
  </div>

  <script>
    // abrir lightbox
    document.addEventListener('click', function (e) {
      const target = e.target;
      if (target.tagName === 'IMG' && target.closest('.card')) {
        const src = target.getAttribute('src');
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');
        lbImg.src = src;
        lb.classList.add('open');
        lb.setAttribute('aria-hidden', 'false');
      }
    });

    // cerrar
    document.getElementById('lbClose').addEventListener('click', function () {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('open');
      lb.setAttribute('aria-hidden', 'true');
      document.getElementById('lbImg').src = '';
    });

    // cerrar con Escape
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const lb = document.getElementById('lightbox');
        if (lb.classList.contains('open')) {
          lb.classList.remove('open');
          lb.setAttribute('aria-hidden', 'true');
          document.getElementById('lbImg').src = '';
        }
      }
    });
  </script>
</body>
</html>
