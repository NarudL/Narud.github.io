<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NarudL · Portafolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>NarudL Fotografía</h1>
    <nav>
      <ul>
        <li><a href="#modelos">Modelos</a></li>
        <li><a href="#terrenal">Terrenal</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="modelos" class="gallery-section">
      <h2>Modelos</h2>
      <div class="gallery">
        <div class="thumb"><img src="Modelos/modelo1.jpg" alt="Modelo 1"></div>
        <div class="thumb"><img src="Modelos/modelo2.jpg" alt="Modelo 2"></div>
        <div class="thumb"><img src="Modelos/modelo3.jpg" alt="Modelo 3"></div>
        <!-- Añade más miniaturas según tus fotos -->
      </div>
    </section>

    <section id="terrenal" class="gallery-section">
      <h2>Terrenal</h2>
      <div class="gallery">
        <div class="thumb"><img src="Terrenal/terr1.jpg" alt="Terrenal 1"></div>
        <div class="thumb"><img src="Terrenal/terr2.jpg" alt="Terrenal 2"></div>
        <div class="thumb"><img src="Terrenal/terr3.jpg" alt="Terrenal 3"></div>
        <!-- Más fotos si quieres -->
      </div>
    </section>
  </main>

  <footer id="contacto" class="site-footer">
    <p>Email: tuemail@example.com</p>
    <p>Instagram: @narudl</p>
    <p>© 2025 NarudL</p>
  </footer>

  <!-- Modal / Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img" src="" alt="Imagen ampliada">
  </div>

  <script src="script.js"></script>
</body>
</html>
