<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NarudL</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
    }

    header {
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('portada.jpg') no-repeat center center/cover;
    }

    header h1 {
      font-size: 3rem;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      overflow: hidden;
      border-radius: 10px;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    .card img:hover {
      transform: scale(1.1);
    }

    footer {
      padding: 20px;
      background: #000;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>NarudL Fotografía</h1>
  </header>

  <main>
    <section class="gallery">
      <!-- Fotos de Modelos -->
      <div class="card"><img src="Modelos/modelo1.jpg" alt="Modelo 1"></div>
      <div class="card"><img src="Modelos/modelo2.jpg" alt="Modelo 2"></div>

      <!-- Fotos de Terrenal -->
      <div class="card"><img src="Terrenal/terr1.jpg" alt="Terrenal 1"></div>
      <div class="card"><img src="Terrenal/terr2.jpg" alt="Terrenal 2"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 NarudL - Todos los derechos reservados</p>
  </footer>
</body>
</html>
