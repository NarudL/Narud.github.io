<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NarudL · Work 01</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="brand">NarudL</h1>
      <p class="project-title">Work 01 — Modelos</p>
    </div>
  </header>

  <main class="project">
    <div class="wrap">
      <!-- Cada figure representa una foto (sustituye los nombres por los tuyos reales) -->
      <section class="stack">
        <figure id="img-1"><img src="Modelos/modelo1.jpg" alt="Modelo 1"><figcaption>Modelo 1 — descripción breve</figcaption></figure>
        <figure id="img-2"><img src="Modelos/modelo2.jpg" alt="Modelo 2"><figcaption>Modelo 2</figcaption></figure>
        <figure id="img-3"><img src="Modelos/modelo3.jpg" alt="Modelo 3"><figcaption>Modelo 3</figcaption></figure>
        <figure id="img-4"><img src="Modelos/modelo4.jpg" alt="Modelo 4"><figcaption>Modelo 4</figcaption></figure>
        <!-- Añade/quita <figure> según tus fotos -->
      </section>
    </div>
  </main>

  <!-- Lightbox / vista individual -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Cerrar">✕</button>
    <button class="lb-nav lb-prev" aria-label="Anterior">‹</button>
    <div class="lb-figure">
      <img class="lb-img" src="" alt="">
      <figcaption class="lb-caption"></figcaption>
    </div>
    <button class="lb-nav lb-next" aria-label="Siguiente">›</button>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <p>© 2025 NarudL · Instagram: @narudl · Email: tuemail@example.com</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
